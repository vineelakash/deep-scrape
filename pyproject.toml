[project]
name = "deep-scrape"
version = "1.0.0"
description = "Autonomous Web & Multi-Platform Intelligence Engine for AI Agents. Search, read, and deep-scrape across 15+ platforms."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "vineel"}]
keywords = [
    "ai-agent", "scraping", "lead-intelligence", "deep-scrape", "mcp",
    "web-reader", "web-scraper", "search", "exa-search",
    "twitter-scraper", "reddit-scraper", "linkedin-scraper", "youtube-transcript",
    "automation", "b2b-lead-generation", "claude-code", "cursor", "antigravity"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "yt-dlp[default]>=2026.07.04",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
cookies = ["browser-cookie3>=0.19"]
all = ["playwright>=1.40", "mcp[cli]>=1.0", "browser-cookie3>=0.19"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[project.scripts]
deepscrape = "deep_scrape.cli:main"
deep-scrape = "deep_scrape.cli:main"

[project.urls]
Homepage = "https://github.com/vineelakash/deep-scrape"
Repository = "https://github.com/vineelakash/deep-scrape"
Issues = "https://github.com/vineelakash/deep-scrape/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_scrape"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
